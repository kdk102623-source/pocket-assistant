<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%277%27 fill=%27%23ff3d7f%27/%3E%3C/svg%3E">
<title>포챔스 어시스트 · 미니 배틀</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Oxanium:wght@600;800&display=swap" rel="stylesheet">
<style>
/* 배틀 중계 분석 화면: 밤 경기장 남색 + 게임 이름판 색(상대 분홍·나 보라). 강조는 '상대의 다음 수' 막대 한 곳에만 */
:root {
  --night: #0a0e1c; --panel: #121830; --panel2: #18203d; --line: #263056; --ink: #eef1fa; --muted: #8d97ba;
  --opp: #ff3d7f; --me: #7c6cff; --atk: #ff5a3c; --sta: #ffc53d; --swi: #2fdc96; --ok: #2fdc96; --no: #ff5a6e;
  --disp: "Black Han Sans", "IBM Plex Sans KR", sans-serif; --num: "Oxanium", "IBM Plex Sans KR", sans-serif;
}
* { box-sizing: border-box; }
html, body { background: var(--night); }
body { margin: 0; color: var(--ink); font: 15px/1.5 "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; -webkit-font-smoothing: antialiased; }
main { max-width: 520px; margin: 0 auto; padding: 14px 16px 120px; display: grid; gap: 12px; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--me); outline-offset: 2px; }
.muted { color: var(--muted); font-size: 13px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; min-width: 0; }

/* 상단 줄 */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-family: var(--disp); font-size: 19px; letter-spacing: .2px; display: flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; }
.brand i { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, var(--opp), var(--me)); box-shadow: 0 0 12px var(--opp); }
.pill { font-family: var(--num); font-size: 14px; padding: 4px 10px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); white-space: nowrap; }

/* ---- 팀 고르기 ---- */
.hero h1 { font-family: var(--disp); font-weight: 400; font-size: 30px; line-height: 1.15; margin: 6px 0 4px; }
.hero p { margin: 0; color: var(--muted); }
.search { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); font: inherit; }
.search::placeholder { color: var(--muted); }
.pool { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.mon { position: relative; display: grid; justify-items: center; gap: 2px; padding: 8px 4px 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); font-size: 12.5px; }
.mon img { width: 56px; height: 56px; image-rendering: pixelated; object-fit: contain; }
.mon.on { border-color: var(--me); background: linear-gradient(180deg, rgba(124,108,255,.25), var(--panel2)); }
.mon .n { position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; border-radius: 6px; background: var(--me); color: #fff; font: 700 12px/20px var(--num); }
.dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, rgba(10,14,28,0), rgba(10,14,28,.94) 30%); }
.dock > div { max-width: 520px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
.slots { display: flex; gap: 6px; flex: 1; min-width: 0; }
.slot { width: 46px; height: 46px; border-radius: 10px; border: 1px dashed var(--line); background: var(--panel); display: grid; place-items: center; position: relative; }
.slot img { width: 40px; height: 40px; image-rendering: pixelated; }
/* ---- 도구 고르기 ---- */
.itemsum { display: grid; gap: 6px; }
.itemsum button { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); text-align: left; }
.itemsum button.cur { border-color: var(--me); background: linear-gradient(90deg, rgba(124,108,255,.28), var(--panel2)); }
.itemsum img { width: 40px; height: 40px; image-rendering: pixelated; }
.itemsum b { font-family: var(--num); color: var(--me); width: 14px; }
.itemsum span { flex: 1; } .itemsum em { font-style: normal; color: var(--sta); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel2); font-size: 14px; }
.chip.on { border-color: var(--me); background: rgba(124,108,255,.3); font-weight: 700; }
.chip:disabled { opacity: .35; cursor: default; text-decoration: line-through; }
.itemall { max-height: 260px; overflow-y: auto; padding: 2px; }
button.slot { padding: 0; border-style: solid; border-color: var(--me); }
.slot b { position: absolute; top: -6px; left: -6px; font: 700 10px/16px var(--num); width: 16px; height: 16px; border-radius: 5px; background: var(--me); color: #fff; text-align: center; }
.go { border: 0; border-radius: 12px; padding: 13px 18px; font-weight: 700; color: #fff; background: linear-gradient(100deg, var(--me), var(--opp)); box-shadow: 0 6px 20px rgba(255,61,127,.3); }
.go:disabled { filter: grayscale(.8); opacity: .5; box-shadow: none; cursor: default; }
.ghost { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 12px; color: var(--ink); white-space: nowrap; }

/* ---- 배틀 필드: 상대 오른쪽 위 · 나 왼쪽 아래 ---- */
.field { position: relative; height: 330px; border-radius: 18px; overflow: hidden; border: 1px solid var(--line);
  background:
    radial-gradient(ellipse 60% 40% at 72% 30%, rgba(255,61,127,.20), transparent 70%),
    radial-gradient(ellipse 60% 40% at 26% 78%, rgba(124,108,255,.25), transparent 70%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 34px),
    linear-gradient(180deg, #121a3a, #0b1024 60%, #0d0f22); }
.ground { position: absolute; border-radius: 50%; }
.ground.opp { right: 3%; top: 52%; width: 46%; height: 11%; background: radial-gradient(rgba(255,61,127,.28), transparent 70%); }
.ground.me { left: 2%; bottom: 26%; width: 52%; height: 12%; background: radial-gradient(rgba(124,108,255,.35), transparent 70%); }
.spr { position: absolute; z-index: 1; image-rendering: pixelated; object-fit: contain; transition: opacity .35s, transform .2s; filter: drop-shadow(0 6px 6px rgba(0,0,0,.45)); }
.spr.opp { right: 10%; top: 27%; width: 104px; height: 104px; }
.spr.me { left: 8%; bottom: 29%; width: 124px; height: 124px; transform: scaleX(-1); }
.spr.gone { opacity: 0; }
.spr.opp.shake { animation: shake .35s; } .spr.me.shake { animation: shakeMe .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes shakeMe { 25% { transform: scaleX(-1) translateX(-6px); } 75% { transform: scaleX(-1) translateX(6px); } }
/* 이름판: 게임처럼 비스듬한 판 */
.plate { position: absolute; z-index: 2; width: 57%; padding: 6px 16px 7px; color: #fff; clip-path: polygon(6% 0, 100% 0, 94% 100%, 0 100%); }
.plate.opp { right: 2%; top: 4%; background: linear-gradient(100deg, #c2185b, var(--opp)); }
.plate.me { left: 2%; bottom: 4%; background: linear-gradient(100deg, #4b3fc0, var(--me)); }
.plate .nm { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; font-weight: 700; font-size: 14px; }
.plate .st { font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 4px; background: rgba(0,0,0,.35); }
.hpbar { height: 7px; margin-top: 4px; border-radius: 4px; background: rgba(0,0,0,.45); overflow: hidden; }
.hpbar > div { height: 100%; width: 100%; background: #6be04a; transition: width .5s ease, background .5s; }
.plate .row2 { display: flex; justify-content: space-between; align-items: center; margin-top: 2px; }
.plate .num { font: 800 17px/1.1 var(--num); font-style: italic; }
.plate .num small { font-size: 11px; font-weight: 600; opacity: .85; }
.dots { display: flex; gap: 3px; } .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.9); } .dots i.off { background: rgba(0,0,0,.4); }
/* 대사: 실제 게임처럼 상자 없이 흰 글씨 두 줄, 필드 왼쪽 가운데. 뒤에 옅은 어둠 띠만 */
.ticker { position: absolute; z-index: 3; left: 0; right: 0; top: 50%; padding: 10px 18px 10px 20%; min-height: 64px; display: grid; align-content: center;
  background: linear-gradient(90deg, rgba(0,0,0,.55), rgba(0,0,0,.35) 60%, transparent); color: #fff; font-size: 16px; font-weight: 600; line-height: 1.55; letter-spacing: .2px;
  text-shadow: 0 1px 2px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.6); opacity: 0; transition: opacity .15s; pointer-events: none; }
.ticker.show { opacity: 1; }
.ticker span { display: block; white-space: nowrap; }
/* 특성 발동: 게임처럼 그 포켓몬 쪽에 판이 미끄러져 나옴 */
.abil { position: absolute; z-index: 4; padding: 5px 16px 6px; color: #fff; clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%); line-height: 1.25; pointer-events: none; animation: abilIn 1.6s ease forwards; }
.abil small { display: block; font-size: 11px; opacity: .85; } .abil b { font-family: var(--disp); font-weight: 400; font-size: 17px; }
.abil.opp { right: 2%; top: 25%; background: linear-gradient(100deg, #8e1446, #d42d6c); }
.abil.me { left: 2%; bottom: 25%; background: linear-gradient(100deg, #3a2f9a, #5f50e0); }
@keyframes abilIn { 0% { opacity: 0; transform: translateX(var(--from)); } 12%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.abil.opp { --from: 30px; } .abil.me { --from: -30px; }
/* 특성 정보 줄 */
.info { display: grid; gap: 4px; font-size: 13px; padding: 8px 10px; border-radius: 10px; background: var(--panel2); }
.info .who { font-weight: 700; margin-right: 6px; }
.info .who.opp { color: var(--opp); } .info .who.me { color: #a99fff; }
.info .d { display: block; color: var(--muted); font-size: 12px; }
.log .why { color: var(--sta); }
/* 이펙트: 공격 = 맞는 쪽 번쩍, 변화 = 위로 올라가는 화살표, 방어 = 방패 */
.fx { position: absolute; z-index: 2; pointer-events: none; }
.fx.hit { width: 72px; height: 72px; margin: -36px 0 0 -36px; border-radius: 50%; background: radial-gradient(circle, #fff 0 16%, #ffe066 30%, rgba(255,90,60,.6) 52%, transparent 70%); animation: hit .45s ease-out forwards; }
@keyframes hit { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }
.fx.up { color: var(--sta); font-size: 22px; font-weight: 900; text-shadow: 0 0 8px rgba(255,197,61,.9); animation: up .9s ease-out forwards; }
@keyframes up { from { transform: translateY(10px); opacity: 0; } 25% { opacity: 1; } to { transform: translateY(-46px); opacity: 0; } }
.fx.shield { width: 122px; height: 122px; margin: -61px 0 0 -61px; border-radius: 50%; border: 3px solid #8fe3ff; background: radial-gradient(circle, transparent 55%, rgba(143,227,255,.35) 70%, transparent 72%); box-shadow: 0 0 18px #6fd0ff; animation: shield .9s ease-out forwards; }
@keyframes shield { 0% { transform: scale(.7); opacity: 0; } 25% { transform: scale(1); opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .fx, .spr { animation: none !important; transition: none !important; } }

/* ---- 상대의 다음 수 (이 화면의 주인공) ---- */
.read { border-color: #34407a; background: linear-gradient(180deg, #171f43, var(--panel)); }
.read .head { display: flex; justify-content: space-between; align-items: baseline; }
.read .head b { font-family: var(--disp); font-weight: 400; font-size: 17px; }
.call { display: flex; align-items: baseline; gap: 10px; }
.call .what { font-family: var(--disp); font-size: 38px; line-height: 1; }
.call .pct { font: 800 34px/1 var(--num); }
.meter { display: flex; height: 16px; border-radius: 8px; overflow: hidden; background: var(--panel2); }
.meter > div { transition: width .5s ease; }
.legend { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-size: 13px; }
.legend span { display: flex; align-items: center; gap: 6px; } .legend i { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.legend b { font-family: var(--num); margin-left: auto; }
.verdict { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; background: var(--panel2); font-size: 14px; }
.verdict .tag { font-weight: 700; padding: 1px 8px; border-radius: 6px; color: #08101e; flex: none; }
.verdict.ok .tag { background: var(--ok); } .verdict.no .tag { background: var(--no); }

/* ---- 내 선택 ---- */
.act .head { display: flex; justify-content: space-between; align-items: center; }
.mega { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.moves { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.move { position: relative; text-align: left; padding: 11px 12px 10px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); overflow: hidden; }
.move::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--tc, var(--muted)); }
.move b { display: block; font-weight: 700; } .move small { color: var(--muted); font-size: 12px; }
.move:disabled, .swap:disabled { opacity: .45; cursor: default; }
.swaps { display: flex; gap: 8px; flex-wrap: wrap; }
.swaps:empty { display: none; }
.swap { display: flex; align-items: center; gap: 6px; padding: 6px 12px 6px 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); font-size: 13px; }
.swap img { width: 34px; height: 34px; image-rendering: pixelated; }
.log { font-size: 13px; color: var(--muted); max-height: 6.2em; overflow-y: auto; display: grid; gap: 1px; }

/* ---- 결과 ---- */
.result { text-align: center; justify-items: center; }
.result .big { font-family: var(--disp); font-size: 40px; line-height: 1.1; }
.ring { width: 132px; height: 132px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--ok) calc(var(--p) * 1%), var(--panel2) 0); }
.ring > div { width: 104px; height: 104px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; align-content: center; font: 800 28px/1 var(--num); }
.ring small { display: block; font: 400 12px var(--disp); color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
<main>
  <div class="top"><a class="brand" href="index.html"><i></i>포챔스 어시스트</a><span class="pill" id="scoreLbl" hidden>적중 0/0</span></div>

  <!-- 1. 팀 고르기 -->
  <section id="pickScreen" style="display:grid;gap:12px">
    <div class="hero">
      <h1>상대의 다음 수,<br>먼저 읽어 볼까요?</h1>
      <p>포켓몬 3마리를 고르면 배틀이 시작돼요. 상대는 배틀 기록에 따른 AI 규칙에 따라 조종돼요. 매 턴 우리 도구가 상대가 공격·변화·교체 중 무엇을 할지 먼저 예측하고, 맞았는지 바로 알려 줘요.</p>
    </div>
    <input class="search" type="search" id="q" placeholder="포켓몬 이름으로 찾기" aria-label="포켓몬 이름으로 찾기">
    <div class="muted" id="loadState">배틀 엔진 준비 중… 처음 한 번만 조금 걸려요</div>
    <div class="pool" id="pool"></div>
  </section>

  <!-- 1-2. 도구 고르기 (차례대로) -->
  <section id="itemScreen" hidden style="display:grid;gap:12px">
    <div class="hero"><h1>도구를 골라 주세요</h1><p>한 마리씩 차례대로 골라요. 같은 도구는 두 마리가 함께 들 수 없어요.</p></div>
    <div class="itemsum" id="itemSum"></div>
    <div class="panel" id="itemPickWrap">
      <b id="itemFor"></b>
      <div class="muted">이 포켓몬이 자주 드는 도구</div>
      <div class="chips" id="itemTop"></div>
      <input class="search" type="search" id="itemQ" placeholder="도구 이름으로 찾기" aria-label="도구 이름으로 찾기">
      <div class="chips itemall" id="itemAll"></div>
    </div>
    <div class="panel muted" id="itemFixed" hidden></div>
  </section>

  <!-- 2. 배틀 -->
  <section id="battleScreen" hidden style="display:grid;gap:12px">
    <div class="field" id="field">
      <div class="ground opp"></div><div class="ground me"></div>
      <img class="spr opp gone" id="oppSpr" alt=""><img class="spr me gone" id="meSpr" alt="">
      <div class="plate opp"><div class="nm"><span id="oppName">—</span><span class="st" id="oppSt" hidden></span></div><div class="hpbar"><div id="oppHp"></div></div><div class="row2"><span class="dots" id="oppDots"></span><span class="num" id="oppNum">100<small>%</small></span></div></div>
      <div class="plate me"><div class="nm"><span id="meName">—</span><span class="st" id="meSt" hidden></span></div><div class="hpbar"><div id="meHp"></div></div><div class="row2"><span class="dots" id="meDots"></span><span class="num" id="meNum">—</span></div></div>
      <div class="ticker" id="ticker" aria-hidden="true"></div>
    </div>

    <div class="panel read" id="predCard" hidden>
      <div class="head"><b>상대의 다음 수</b><span class="muted" id="turnLbl">1턴</span></div>
      <div class="call"><span class="what" id="predWhat">—</span><span class="pct" id="predPct"></span></div>
      <div class="meter" id="meter" role="img" aria-label="예측 확률"></div>
      <div class="legend" id="legend"></div>
      <div class="verdict" id="verdict" hidden></div>
    </div>

    <div class="panel act" id="actCard" hidden>
      <div class="head"><b id="actTitle">어떤 기술을 쓸까요?</b><label class="mega" id="megaWrap" hidden><input type="checkbox" id="megaChk"> 메가진화</label></div>
      <div class="info" id="abilInfo"></div>
      <div class="moves" id="moves"></div>
      <div class="swaps" id="switches"></div>
      <div class="log" id="log" aria-live="polite"></div>
    </div>

    <div class="panel result" id="endCard" hidden>
      <div class="big" id="endBig">—</div>
      <div class="ring" id="ring" style="--p:0"><div><span id="ringPct">0%</span><small>예측 적중</small></div></div>
      <div class="muted" id="endText"></div>
      <button class="go" id="againBtn">한 판 더</button>
    </div>
  </section>
</main>

<div class="dock" id="dock"><div>
  <div class="slots" id="slots"></div>
  <button class="ghost" id="randomBtn">아무거나</button>
  <button class="ghost" id="backBtn" hidden>뒤로</button>
  <button class="go" id="startBtn" disabled>도구 고르기</button>
</div></div>

<script>
// 포챔스 어시스트 예측 계산 (웹페이지와 node 검산이 함께 쓰는 파일)
// model_lr.situation()과 같은 순서·같은 정의로 변수를 만들고, 로지스틱 회귀 가중치로 확률을 낸다.
// '상대' = 예측 대상(모델의 me_), '나' = 사용자(모델의 foe_)

const ROLLS = Array.from({ length: 16 }, (_, i) => (85 + i) / 100);
const STAGE = s => (s >= 0 ? (2 + s) / 2 : 2 / (2 - s));
const clip = (v, a, b) => Math.max(a, Math.min(b, v));

function makeCore(M) {
  const mon = sp => M.mons[sp] || { types: [], stats: { hp: 155, atk: 100, def: 100, spa: 100, spd: 100, spe: 100 }, attacks: [], moves: [] };

  function eff(atkType, defTypes) {  // 타입 상성 배율. 특성(부유 등)은 무시
    let m = 1;
    for (const t of defTypes) m *= [1, 2, 0.5, 0][(M.typechart[t] || {})[atkType] || 0];
    return m;
  }
  const bestTypeEff = (a, d) => Math.max(1e-9, ...mon(a).types.map(t => eff(t, mon(d).types)), mon(a).types.length ? 0 : 1);

    let best = 0;
    for (const k of moves) {
      const mv = M.moves[k];
      if (!mv || !mv.bp) continue;
      const phys = mv.cat === "Physical";
      const A = (phys ? A0.atk : A0.spa) * STAGE(aSide.atkStage || 0);
      const D = (phys ? D0.def : D0.spd) * STAGE(dSide.defStage || 0);
      let dmg = ((22 * mv.bp * A) / D) / 50 + 2;
      dmg *= (at.includes(mv.type) ? 1.5 : 1) * eff(mv.type, dt) * (phys && aSide.status === "brn" ? 0.5 : 1);
      const pct = (100 * dmg) / D0.hp;

  }

  const speed = (sp, side) => mon(sp).stats.spe * STAGE(side.speStage || 0) * (side.status === "par" ? 0.5 : 1) * (side.scarf ? 1.5 : 1);

  // 모델 입력 변수 24개 (model_lr.situation과 같은 순서)
  function features(st) {
    const o = st.opp, u = st.me;  // o = 상대(예측 대상), u = 나
    const typeEff = bestTypeEff(u.sp, o.sp);
    const foeKo = koProb(u.sp, o.sp, o.hp, u, o, u.used || []);
    const meKo = koProb(o.sp, u.sp, u.hp, o, u, o.revealed);
    const so = speed(o.sp, o), su = speed(u.sp, u);
    const fast = st.trickRoom ? +(so < su) : +(so > su);

          o.hp / 100, u.hp / 100, clip(sum(o), -4, 4) / 4, clip(sum(u), -4, 4) / 4, +(o.alive === 2), u.alive / 3,
          Math.min(o.revealed.length, 4) / 4, +rev.some(m => m.pivot), +rev.some(m => m.protect), +rev.some(m => m.cat === "Status"),
          Math.min(st.turn, 15) / 15, +!!st.trickRoom],
      info: { typeEff, foeKo, meKo, fast, so, su },
    };
  }

  function predict(st) {
    const { x, info } = features(st);
    const nS = M.species.length + 1, idx = M.species.indexOf(st.opp.sp), sIdx = idx < 0 ? nS - 1 : idx;
    const keyIdx = M.key.map(k => M.cols.indexOf(k));
    let p = M.coef.map((w, c) => {
      let z = M.intercept[c];
      for (let j = 0; j < x.length; j++) z += w[j] * x[j];
      z += w[x.length + sIdx];  // 포켓몬 기본 성향
      keyIdx.forEach((kj, i) => { z += w[x.length + nS + i * nS + sIdx] * x[kj] * M.s; });  // 포켓몬별 차이

    const tot = p.reduce((a, b) => a + b, 0);
    return { p: p.map(v => v / tot), x, info };
  }

  return { predict, features, koProb, bestTypeEff, mon };
}

// 마스코트: 이름과 말투는 여기만 고치면 바뀐다 (데모: 피카츄, 공개 전 교체 예정)
const MASCOT = { name: "피카츄", tail: ["피카!", "피카피카!", "피~카!"] };

function guideLine(st, r, labels, koName) {
  const order = labels.map((l, i) => [l, r.p[i]]).sort((a, b) => b[1] - a[1]);
  const [[a1, p1], [a2, p2]] = order, pct = v => Math.round(v * 100);
  const name = koName(st.opp.sp).replace(/\(.*\)/, ""), last = name.charCodeAt(name.length - 1);
  const who = name + ((last - 0xac00) % 28 ? "은" : "는");  // 받침 있으면 '은', 없으면 '는'
  const verb = { 공격: "공격할", 변화: "변화기를 쓸", 교체: "교체할" }[a1];
  let head;
  if (p1 >= 0.6) head = `${who} ${verb} 거예요 (${pct(p1)}%).`;
  else if (p1 - p2 >= 0.15) head = `${a1} 쪽이 더 높아요. ${a1} ${pct(p1)}%, ${a2} ${pct(p2)}%.`;
  else head = `${a1} ${pct(p1)}%, ${a2} ${pct(p2)}%. 거의 반반이에요!`;
  const i = r.info, why = [];
  if (i.typeEff >= 4) why.push("4배 약점이라 빠질 수 있어요");
  else if (i.typeEff >= 2) why.push("약점을 찔려서 교체를 조심해요");
  if (i.meKo >= 0.9 && i.fast) why.push("저쪽이 먼저 때려서 우리를 쓰러뜨릴 수 있어요");
  if (i.foeKo >= 0.9 && !i.fast) why.push("우리가 먼저 한 방에 잡을 수 있어요");
  if (st.opp.last === "변화") why.push("랭크업을 이어갈 수도 있어요");
  const tail = MASCOT.tail[(st.turn + st.opp.turnsIn) % MASCOT.tail.length];
  return `${head}${why.length ? " " + why.slice(0, 2).join(", ") + "." : ""} ${tail}`;
}

  worker.onerror = () => { $("loadState").textContent = "배틀 엔진을 불러오지 못했어요. 새로고침해 주세요"; };
})();

// ---- 배틀 상태 (예측기 입력) ----
let st, pending = null, score = { hit: 0, n: 0, sta: 0, staHit: 0 };
const fresh = () => ({ turn: 1, trickRoom: false,
  opp: { sp: "", hp: 100, alive: 3, last: "없음", turnsIn: 1, revealed: [], atkStage: 0, defStage: 0, speStage: 0, status: "", scarf: false },
  me: { sp: "", hp: 100, alive: 3, used: [], atkStage: 0, defStage: 0, speStage: 0, status: "", scarf: false } });
// ---- 도구 고르기: 기본값 = 세트 도구 → 자주 쓰는 도구 순으로, 앞 포켓몬과 겹치지 않게 (도구 중복 금지 규칙) ----
const itemKo = id => (ITEMS[id] && ITEMS[id].ko) || "없음";
const megaItem = i => ITEMS[POOL[i].set.item] && ITEMS[POOL[i].set.item].mega;  // 메가 포켓몬은 메가스톤 고정
function openItems() {
  itemSel = [];
  picked.forEach((i, k) => { const c = [POOL[i].set.item, ...(POOL[i].items || [])].filter(x => ITEMS[x] && (!ITEMS[x].mega || x === POOL[i].set.item));
    itemSel[k] = megaItem(i) ? POOL[i].set.item : c.find(x => !itemSel.includes(x)) || ""; });
  itemStep = 0; $("itemQ").value = "";
  $("pickScreen").hidden = true; $("itemScreen").hidden = false; $("randomBtn").hidden = true; $("backBtn").hidden = false;
  renderItems(); window.scrollTo(0, 0);
}
function renderItems() {
  const i = picked[itemStep], cur = itemSel[itemStep], taken = new Set(itemSel.filter((x, k) => k !== itemStep && x));
  $("itemSum").innerHTML = picked.map((j, k) => `<button class="${k === itemStep ? "cur" : ""}" data-step="${k}"><b>${k + 1}</b><img src="${icon(POOL[j].id)}" alt=""><span>${POOL[j].ko}</span><em>${itemKo(itemSel[k])}</em></button>`).join("");
  const mega = megaItem(i);
  $("itemPickWrap").hidden = mega; $("itemFixed").hidden = !mega;
  if (mega) $("itemFixed").textContent = `${POOL[i].ko}는 메가진화하려면 ${josa(itemKo(cur), "이", "가")} 필요해서 바꿀 수 없어요.`;
  else {
    const chip = id => `<button class="chip${id === cur ? " on" : ""}" data-it="${id}"${taken.has(id) ? ` disabled title="다른 포켓몬이 들고 있어요"` : ""}>${itemKo(id)}</button>`;
    $("itemFor").textContent = `${itemStep + 1}번 ${POOL[i].ko}의 도구`;
    $("itemTop").innerHTML = (POOL[i].items || []).filter(x => ITEMS[x] && !ITEMS[x].mega).map(chip).join("") || `<span class="muted">사용 통계가 없어요 · 아래에서 찾아 주세요</span>`;
    const q = $("itemQ").value.trim();
    $("itemAll").innerHTML = Object.keys(ITEMS).filter(x => !ITEMS[x].mega && (!q || ITEMS[x].ko.includes(q))).sort((a, b) => ITEMS[a].ko.localeCompare(ITEMS[b].ko, "ko")).map(chip).join("") || `<span class="muted">찾는 도구가 없어요</span>`;
  }
  $("startBtn").textContent = itemStep === 2 ? "배틀 시작" : "다음 포켓몬";
}
$("itemScreen").onclick = e => {
  const s = e.target.closest("button[data-step]"); if (s) { itemStep = +s.dataset.step; return renderItems(); }
  const b = e.target.closest("button[data-it]"); if (!b || b.disabled) return;
  itemSel[itemStep] = b.dataset.it; renderItems();
  if (itemStep < 2) setTimeout(() => { itemStep++; $("itemQ").value = ""; renderItems(); window.scrollTo(0, 0); }, 250);  // 고르면 다음 포켓몬으로
};
$("itemQ").oninput = renderItems;
$("backBtn").onclick = () => { $("itemScreen").hidden = true; $("pickScreen").hidden = false; $("randomBtn").hidden = false; $("backBtn").hidden = true; $("startBtn").textContent = "도구 고르기"; syncPick(); };
$("startBtn").onclick = () => { if ($("itemScreen").hidden) return openItems(); if (itemStep < 2) { itemStep++; $("itemQ").value = ""; return renderItems(); } startBattle(); };
function startBattle() {
  const opp = pick3(topIdx(), picked);
  st = fresh(); score = { hit: 0, n: 0, sta: 0, staHit: 0 }; pending = null; oppAbil = {}; $("log").innerHTML = ""; $("verdict").hidden = true;
  for (const k of ["opp", "me"]) { $(k + "Spr").removeAttribute("src"); $(k + "Spr").dataset.sp = ""; $(k + "Spr").classList.add("gone"); }
  $("pickScreen").hidden = true; $("itemScreen").hidden = true; $("dock").hidden = true; $("battleScreen").hidden = false; $("endCard").hidden = true; $("predCard").hidden = true; $("actCard").hidden = true;
  $("scoreLbl").hidden = false; $("scoreLbl").textContent = "적중 0/0";
  window.scrollTo(0, 0);
  worker.postMessage({ kind: "start", teams: [picked.map((i, k) => ({ ...POOL[i].set, item: itemSel[k] || "" })), opp.map(i => POOL[i].set)], seed: (Math.random() * 2 ** 31) | 0 });
};
$("againBtn").onclick = () => { $("battleScreen").hidden = true; $("scoreLbl").hidden = true; $("pickScreen").hidden = false; $("dock").hidden = false; $("randomBtn").hidden = false; $("backBtn").hidden = true; $("startBtn").textContent = "도구 고르기"; syncPick(); window.scrollTo(0, 0); };

let tickT = 0;
// 게임처럼 두 줄로: "상대 아머까오의 / 쪼아대기!", 긴 문장은 첫 '은/는/이/가' 뒤에서
function lines(t) {
  let i = t.indexOf("의 ");
  if (i > 0 && i < 14) i += 2;
  else if (t.length > 14) { const m = /[은는이가] /.exec(t); i = m && m.index < 16 ? m.index + 2 : t.lastIndexOf(" ", Math.ceil(t.length / 2)) + 1; }
  else i = 0;
  return i > 0 && i < t.length ? [t.slice(0, i).trim(), t.slice(i).trim()] : [t];
}
function log(t, why) {  // why: 이 일이 일어난 이유(특성)
  const d = document.createElement("div");
  if (why) { const w = document.createElement("span"); w.className = "why"; w.textContent = why + " → "; d.appendChild(w); }
  d.appendChild(document.createTextNode(t)); $("log").appendChild(d); $("log").scrollTop = 1e9;
  const tk = $("ticker"); tk.replaceChildren(...lines(t).map(l => { const s = document.createElement("span"); s.textContent = l; return s; }));
  tk.classList.add("show"); clearTimeout(tickT); tickT = setTimeout(() => tk.classList.remove("show"), 2200);
}
function abilPop(k, who, name) {
  const d = document.createElement("div"); d.className = "abil " + k; d.innerHTML = "<small></small><b></b>";
  d.firstChild.textContent = who + "의"; d.lastChild.textContent = name; $("field").appendChild(d); setTimeout(() => d.remove(), 1700);
}
function busy(on) { $("actCard").querySelectorAll("button").forEach(b => b.disabled = on); if (on) $("actTitle").textContent = "상대가 고르는 중…"; }
const key = side => side === "p2" ? "opp" : "me";
const nm = id => KO[id] || id;

// ---- 그리기 ----
const lastMax = {};
function setHp(k, hp, maxhp) {
  if (maxhp > 1) lastMax[k] = maxhp; else maxhp = lastMax[k] || 1;  // 쓰러질 때 엔진이 최대 HP를 0으로 보냄 → 직전 값 유지
  const pct = Math.max(0, Math.min(100, 100 * hp / maxhp)), bar = $(k + "Hp");
  bar.style.width = pct + "%"; bar.style.background = pct > 50 ? "#6be04a" : pct > 20 ? "#f5c400" : "#f0473c";
  $(k + "Num").innerHTML = k === "opp" ? `${Math.ceil(pct)}<small>%</small>` : `${hp}<small> /${maxhp}</small>`;
}
function setMon(k, p) {
  const s = $(k + "Spr"); if (s.dataset.sp !== p.species) { s.onerror = BASE[p.species] ? () => { s.onerror = null; s.src = icon(BASE[p.species]); } : null; s.src = icon(p.species); s.dataset.sp = p.species; }
  s.classList.toggle("gone", !!p.fainted || p.hp <= 0);
  $(k + "Name").textContent = nm(p.species); setHp(k, p.fainted ? 0 : p.hp, p.maxhp);
  const stt = $(k + "St"); stt.hidden = !STATUS_KO[p.status]; stt.textContent = STATUS_KO[p.status] || "";
}
function fx(kind, k) {
  const f = $("field"), s = $(k + "Spr").getBoundingClientRect(), fr = f.getBoundingClientRect();
  const cx = s.left - fr.left + s.width / 2, cy = s.top - fr.top + s.height / 2;
  const add = (cls, x, y, html = "", delay = 0) => { const d = document.createElement("div"); d.className = "fx " + cls; d.style.left = x + "px"; d.style.top = y + "px"; d.style.animationDelay = delay + "ms"; d.innerHTML = html; f.appendChild(d); setTimeout(() => d.remove(), 1200 + delay); };
  if (kind === "hit") { add("hit", cx, cy); const sp = $(k + "Spr"); sp.classList.remove("shake"); void sp.offsetWidth; sp.classList.add("shake"); }
  else if (kind === "shield") add("shield", cx, cy);
  else [[-34, 10, 0], [0, -6, 120], [34, 10, 240]].forEach(([dx, dy, dl]) => add("up", cx + dx - 8, cy + dy, "▲", dl));
}
function showRead(p) {  // 상대의 다음 수: 1순위 크게 + 한 줄 막대(세 칸) + 범례
  const pct = v => Math.round(v * 100), order = LABELS.map((l, i) => [l, p[i]]).sort((a, b) => b[1] - a[1]);
  $("predWhat").textContent = order[0][0]; $("predWhat").style.color = COLORS[order[0][0]];
  $("predPct").textContent = pct(order[0][1]) + "%";
  $("meter").innerHTML = LABELS.map((l, i) => `<div style="width:${(p[i] * 100).toFixed(1)}%;background:${COLORS[l]}"></div>`).join("");
  $("meter").setAttribute("aria-label", LABELS.map((l, i) => `${l} ${pct(p[i])}%`).join(", "));
  $("legend").innerHTML = LABELS.map((l, i) => `<span><i style="background:${COLORS[l]}"></i>${l}<b>${pct(p[i])}%</b></span>`).join("");
}

// ---- 한 턴 결과를 차례로 보여 주기 ----
async function onState({ view, events, request, ai, over }) {
  let cause = "";  // 방금 발동한 특성: 이어지는 대사에 "~ 특성 때문에"를 붙임
  for (const e of events) {
    const k = e.side ? key(e.side) : null, who = e.side === "p2" ? "상대 " : "", n = e.species ? nm(e.species) : (BYNAME[e.name] || e.name);
    if (e.move || e.kind === "switch" || e.kind === "turn") cause = "";
    const say = (t, w = 600) => { if (!t) return null; log(t, cause && `${cause} 특성 때문에`); cause = ""; return wait(w); };  // 특성 이유는 바로 다음 대사 하나에만
    if (e.kind === "ability") {
      const a = ABIL[e.ability] || { ko: e.ability, desc: "" };
      if (e.side === "p2") oppAbil[IDBYNAME[e.name] || e.name] = e.ability;
      if (k) abilPop(k, who + n, a.ko);
      log(`${who}${n}의 특성 「${a.ko}」${a.desc ? " — " + a.desc : ""}`);
      if (e.ko) await say(e.ko, 700); else await wait(700);
      cause = `${who}${n}의 ${a.ko}`;
    } else if (e.kind === "switch") {
      await say(e.ko || (e.side === "p2" ? `상대는 ${josa(n, "을", "를")} 내보냈다!` : `가랏! ${n}!`), 0);
      setMon(k, { species: e.species, hp: e.hp, maxhp: e.maxhp, status: e.status }); await wait(550);
    } else if (e.move && (e.kind === "move" || e.kind === "message")) {  // 방어·회복 같은 기술은 message로 옴
      if (e.side === "p2" && !st.opp.revealed.includes(e.move)) st.opp.revealed.push(e.move);
      if (e.side === "p1" && !st.me.used.includes(e.move)) st.me.used.push(e.move);
      if (e.ko) log(e.ko);
      const target = e.targetSide && e.targetSide !== e.side ? key(e.targetSide) : null;
      if (PROTECT.has(e.move)) fx("shield", k);
      else if (MOVECAT[e.move] === "변화") fx("up", k);
      else fx("hit", target || (k === "opp" ? "me" : "opp"));
      await wait(750);
    } else if (e.kind === "hp" && k) {  // 회생의 기도처럼 벤치 포켓몬 체력이 바뀌면 지금 나와 있는 이름판은 그대로
      const onField = !e.name || !$(k + "Spr").dataset.sp || (IDBYNAME[e.name] || "") === $(k + "Spr").dataset.sp || BYNAME[e.name] === $(k + "Name").textContent;
      if (onField) setHp(k, e.hp, e.maxhp); await (say(e.ko) || wait(350)); }
    else if (e.kind === "faint") { cause = ""; if (k) { $(k + "Spr").classList.add("gone"); setHp(k, 0, 0); } await say(e.ko || `${who}${josa(n, "은", "는")} 쓰러졌다!`, 650); }
    else if (e.kind === "turn") st.turn = +String(e.text).replace(/\D/g, "") || st.turn;
    else await say(e.ko);
  }
  // 지난 턴 상대 행동 채점
  if (ai && !ai.forced && pending) {
    const top = LABELS[pending.indexOf(Math.max(...pending))], ok = top === ai.kind; score.n++; if (ok) score.hit++; if (ai.kind !== "공격") { score.sta++; if (ok) score.staHit++; }
    const what = ai.choice.kind === "switch" ? "교체" : `${MOVEKO[ai.choice.move] || ai.choice.move}`;
    const v = $("verdict"); v.hidden = false; v.className = "verdict " + (ok ? "ok" : "no");
    v.innerHTML = `<span class="tag">${ok ? "적중" : "빗나감"}</span><span>실제로는 <b>${what}</b> (${ai.kind})${ok ? "" : ` · 예측은 ${top}`}</span>`;
    st.opp.last = ai.kind;
  }
  // 최종 상태로 맞추고 예측기 상태 갱신
  const active = s => view.sides[s].pokemon.find(p => p.active && !p.fainted) || view.sides[s].pokemon.find(p => p.active);
  for (const [s, k] of [["p2", "opp"], ["p1", "me"]]) {
    const p = active(s); if (!p) continue; setMon(k, p);
    const left = view.sides[s].pokemon.filter(x => !x.fainted).length;
    $(k + "Dots").innerHTML = view.sides[s].pokemon.map((x, i) => `<i class="${i < left ? "" : "off"}"></i>`).join("");
    const prev = st[k].sp, sp = NAME[p.species] || p.species;
    if (prev !== sp) { st[k].turnsIn = 1; if (k === "opp") { st.opp.revealed = []; if (prev) st.opp.last = "교체"; } } else if (ai && !ai.forced) st[k].turnsIn++;
    Object.assign(st[k], { sp, hp: Math.round(100 * p.hp / p.maxhp), status: p.status, atkStage: Math.max(p.boosts.atk, p.boosts.spa), defStage: Math.max(p.boosts.def, p.boosts.spd), speStage: p.boosts.spe,
      alive: left, scarf: k === "me" && p.item === "choicescarf" });
  }
  { const me = active("p1"), op = active("p2"), ab = id => ABIL[id] || { ko: id, desc: "" }, esc = t => String(t).replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
    const row = (cls, label, id) => `<div><span class="who ${cls}">${esc(label)}</span>${id ? `<b>${esc(ab(id).ko)}</b><span class="d">${esc(ab(id).desc)}</span>` : `<span class="d">특성은 아직 몰라요 · 발동하면 보여요</span>`}</div>`;
    const itemRow = me ? `<div><span class="who me">도구</span><b>${esc(me.item ? itemKo(me.item) : "없음")}</b>${!me.item ? `<span class="d">들고 있던 도구를 다 썼거나 없어요</span>` : ""}</div>` : "";
    $("abilInfo").innerHTML = (me ? row("me", `내 ${nm(me.species)}`, me.ability) + itemRow : "") + (op ? row("opp", `상대 ${nm(op.species)}`, oppAbil[op.species]) : ""); }
  $("turnLbl").textContent = `${st.turn}턴`; $("scoreLbl").textContent = `적중 ${score.hit}/${score.n}`;
  if (over || !request) {
    if (over) { pending = null; $("actCard").hidden = true; $("predCard").hidden = true; $("endCard").hidden = false;
      const win = view.winner === "나" || view.winner === "p1", rate = score.n ? Math.round(100 * score.hit / score.n) : 0;
      $("endBig").textContent = win ? "승리!" : "아쉬운 패배";
      $("ring").style.setProperty("--p", rate); $("ringPct").textContent = rate + "%";
      $("endText").textContent = `${score.n}턴 중 ${score.hit}번 맞혔어요.` + (score.sta ? ` 상대가 공격이 아닌 수를 둔 ${score.sta}번 중 ${score.staHit}번을 미리 짚었어요.` : "") + ` 이 상대 AI는 공격을 아주 자주 해서, 진짜 실력은 변화기·교체를 미리 짚는 데서 드러나요. 예측은 실제 랭크배틀 기록 5천여 판으로 학습했어요.`;
      $("endCard").scrollIntoView({ behavior: "smooth", block: "center" }); }
    return;
  }
  // 이번 턴 예측 (상대가 고르기 전에)
  if (request.kind === "move") { const r = core.predict(st); pending = r.p; $("predCard").hidden = false; showRead(r.p); } else pending = null;
  // 내 선택지
  $("actCard").hidden = false; const mega = request.choices.some(c => c.transform === "mega");
  $("megaWrap").hidden = !mega; if (!mega) $("megaChk").checked = false;
  const mv = request.choices.filter(c => c.kind === "move" && !c.transform);
  $("moves").innerHTML = mv.map(c => { const m = (request.moves || [])[c.slot - 1] || {}, tc = TYPE_COLOR[MOVETYPE[c.move]];
    return `<button class="move" style="${tc ? `--tc:${tc}` : ""}" data-c='${JSON.stringify(c)}'><b>${MOVEKO[c.move] || c.move}</b><small>${[TYPEKO[MOVETYPE[c.move]], MOVECAT[c.move], m.pp != null ? `PP ${m.pp}` : ""].filter(Boolean).join(" · ")}</small></button>`; }).join("");
  $("switches").innerHTML = request.choices.filter(c => c.kind === "switch" || c.kind === "revive").map(c => { const p = view.sides.p1.pokemon[c.slot - 1];
    return `<button class="swap" data-c='${JSON.stringify(c)}'><img src="${icon(p.species)}" alt="">${c.kind === "revive" ? `${josa(nm(p.species), "을", "를")} 되살리기` : `${nm(p.species)}로 교체`}</button>`; }).join("");
  $("actCard").querySelectorAll("button[data-c]").forEach(b => b.onclick = () => {
    let c = JSON.parse(b.dataset.c);
    if (c.kind === "move" && $("megaChk").checked) { const m = request.choices.find(x => x.kind === "move" && x.slot === c.slot && x.transform === "mega"); if (m) c = m; }
    $("verdict").hidden = true; busy(true); worker.postMessage({ kind: "choose", choice: c });
  });
  busy(false);
  $("actTitle").textContent = request.kind === "move" ? "어떤 기술을 쓸까요?" : request.kind === "revive" ? "되살릴 포켓몬을 골라 주세요 · 체력 절반으로 돌아와요" : "다음 포켓몬을 골라 주세요";
}
</script>
